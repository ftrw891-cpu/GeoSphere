function mzGen(n){const w=Array.from({length:n*n},()=>[1,1,1,1]),seen=new Set([0]),st=[0],D=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];while(st.length){const i=st[st.length-1],r=Math.floor(i/n),c=i%n,nb=D.filter(d=>{const a=r+d[0],b=c+d[1];return a>=0&&a<n&&b>=0&&b<n&&!seen.has(a*n+b)});if(!nb.length){st.pop();continue}const d=nb[Math.floor(Math.random()*nb.length)],j=(r+d[0])*n+c+d[1];w[i][d[2]]=0;w[j][d[3]]=0;seen.add(j);st.push(j)}return w}

if(m.m.length==m.c.length&&!m.fin){m.fin=1;const g=G(S.me),bonus=m.mv<=m.c.length?10:0;S.gok=true;if(!g.done.mm){g.done.mm=1;g.pts+=30+bonus;S.gmsg=`🎉 Semua pasangan ketemu dalam ${m.mv} langkah! +${30+bonus} poin`}else S.gmsg=`🎉 Selesai dalam ${m.mv} langkah! (poin ronde pertama sudah kamu dapat)`}draw(1)}
function gMm(){const m=S.mc;return `<div class="card"><h3>🃏 Memory Match</h3><p class="mu">Cocokkan istilah dengan rumus atau sifatnya. Ketuk dua kartu untuk membukanya.</p><button onclick="mStart()">${m?'Ronde baru':'Mulai'}</button>${S.gmsg?`<div class="ban ${S.gok?'':'w'}" style="margin-top:10px">${S.gmsg}</div>`:''}${m?`<p>Langkah: <b>${m.mv}</b> • Pasangan: <b>${m.m.length/2}/${m.c.length/2}</b></p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${m.c.map((c,i)=>{const mt=m.m.includes(i),op=m.o.includes(i);return `<button class="mcd" style="${mt?'background:var(--ok);color:#fff':op?'background:var(--pr2);color:var(--pr);border:2px solid var(--pr)':''}" ${mt?'disabled':''} onclick="mflip(${i})">${mt||op?e(c.t):'❓'}</button>`}).join('')}</div>`:''}</div>`}
function addER(){const t=$('rt').value.trim(),s=$('rs').value.trim(),a=$('ra').value;if(!t||!s||a==='')return alert('Isi judul, teka-teki, dan kode jawaban.');S.er.push({id:Date.now(),t,s,a:+a,h:$('rh').value.trim()||'Baca teka-teki dengan teliti.',lv:+$('rl').value});draw()}
function addMM(){const a=$('ma').value.trim(),b=$('mb').value.trim();if(!a||!b)return alert('Isi istilah dan pasangannya.');S.mm.push({id:Date.now(),a,b,lv:+$('ml').value});draw()}
function addGP(){const p=+$('xp').value,l=+$('xl').value,t=+$('xt').value,o=+$('xo').value;if([p,l,t].some(x=>!Number.isInteger(x)||x<1||x>10))return alert('Ukuran p, l, t harus bilangan bulat 1–10.');if(lp(p,l,t,o)>400)return alert('Kebutuhan karton melebihi lembar terbesar (400 cm²).');S.gp.push({id:Date.now(),p,l,t,open:o,lv:+$('xlv').value});draw()}
function bxh(p=S.p,l=S.l,t=S.t,pt){let ix=0;const k=20,w=p*k,h=t*k,d=l*k,f=(W,H,tr,lb)=>{const i=ix++;return `<i style="width:${W}px;height:${H}px;left:${-W/2}px;top:${-H/2}px;transform:${tr};${pt&&pt[i]?'background:rgba(253,119,2,.82)':''}">${lb}</i>`};
return f(w,h,`translateZ(${d/2}px)`,'depan')+f(w,h,`rotateY(180deg) translateZ(${d/2}px)`,'')+f(d,h,`rotateY(90deg) translateZ(${w/2}px)`,'')+f(d,h,`rotateY(-90deg) translateZ(${w/2}px)`,'')+f(w,d,`rotateX(90deg) translateZ(${h/2}px)`,'atas')+f(w,d,`rotateX(-90deg) translateZ(${h/2}px)`,'')}
function bxi(){const p=S.p,l=S.l,t=S.t;return `p=${p}, l=${l}, t=${t} • Volume <b>${p*l*t}</b> • Luas permukaan <b>${2*(p*l+p*t+l*t)}</b> • Diagonal ruang <b>${Math.sqrt(p*p+l*l+t*t).toFixed(2)}</b>`}
function bxu(){$('bw').innerHTML=bxh();$('bi').innerHTML=bxi();bfu()}
let dr=null;function dn(v){dr=[v.clientX,v.clientY];v.currentTarget.setPointerCapture(v.pointerId)}
function mv(v){if(!dr)return;const t=v.currentTarget.dataset.t,r=S.r[t];r[1]+=(v.clientX-dr[0])*.6;r[0]-=(v.clientY-dr[1])*.6;dr=[v.clientX,v.clientY];$(t).style.transform=`rotateX(${r[0]}deg) rotateY(${r[1]}deg)`}
const sl=(n,k,cb='bxu')=>`<div><label>${n}: <b>${S[k]}</b></label><input type="range" min="1" max="10" value="${S[k]}" oninput="S.${k}=+this.value;this.previousElementSibling.innerHTML='${n}: <b>'+this.value+'</b>';${cb}()"></div>`;

kartu:()=>`<p class="mu">Ketuk kartu untuk membalik.</p><div class="grid">${S.cards.map((c,i)=>`<div class="flip ${S.flip[i]?'f':''}" onclick="S.flip[${i}]=!S.flip[${i}];this.classList.toggle('f')"><div><span><b>${e(c[0])}</b></span><span>${e(c[1])}</span></div></div>`).join('')}</div>`,
jaring:()=>`<div class="side">${[['biasa','Jaring biasa'],['lipat','Lipat 3D'],['tebak','Interaktif: Tebak'],['susun','Interaktif: Susun']].map(m=>`<button class="${S.jm==m[0]?'on':''}" onclick="S.jm='${m[0]}';draw(1)">${m[1]}</button>`).join('')}</div>`+(S.jm=='lipat'?foldUI():S.jm=='biasa'?`<div class="grid">${S.nets.map(n=>`<div class="card"><b>${e(n.n)}</b>${netH(n.c)}<span class="tag">${valid(n.c)?'Jaring kubus':'Bukan jaring kubus'}</span></div>`).join('')}</div><div class="card"><h3>Jaring balok</h3><p class="mu">Balok punya 3 pasang sisi kongruen (p×l, p×t, l×t); jaringnya enam persegi panjang yang dapat dilipat.</p></div>`:S.jm=='tebak'?`<div class="grid">${S.nets.map((n,i)=>{const d=S.me.ans['n'+i]!==undefined,v=valid(n.c);return `<div class="card"><b>${e(n.n)}</b>${netH(n.c)}${d?`<div class="ban">${S.me.ans['n'+i]==v?'✅ Tepat! ':'❌ Kurang tepat. '}${v?'Keenam persegi menutup kubus saat dilipat.':'Ada sisi yang bertumpuk sehingga tidak menjadi kubus.'}</div>`:`<button onclick="S.me.ans['n${i}']=true;draw(1)">Jaring kubus</button> <button class="g" onclick="S.me.ans['n${i}']=false;draw(1)">Bukan</button>`}</div>`}).join('')}</div>`:`<div class="card"><h3>Susun jaring kubusmu</h3><p class="mu">Ketuk 6 kotak untuk menyusun jaring, lalu periksa.</p>${gridH(S.bd,'tb')}<button onclick="bchk()">Periksa</button> <button class="g" onclick="S.bd=[];draw(1)">Reset</button><div id="br"></div></div>`),
e3d:()=>`<div class="card"><h3>Eksplorasi 3D balok/kubus</h3><p class="mu">Seret untuk memutar. Ubah ukuran dengan slider (samakan semua untuk kubus).</p><div class="sc" data-t="bw" onpointerdown="dn(event)" onpointermove="mv(event)" onpointerup="dr=null"><div class="bw" id="bw" style="transform:rotateX(${S.r.bw[0]}deg) rotateY(${S.r.bw[1]}deg)">${bxh()}</div></div><div class="grid">${sl('Panjang (p)','p')}${sl('Lebar (l)','l')}${sl('Tinggi (t)','t')}</div><p id="bi">${bxi()}</p><button class="g" onclick="S.l=S.p;S.t=S.p;draw(1)">Jadikan kubus</button></div><div class="card"><h3>Buka & lipat jaring balok</h3><p class="mu">Ukuran mengikuti slider di atas. Geser untuk melipat, seret untuk memutar.</p>${sceneH('fb',balokTree(S.p,S.l,S.t),S.fb*.9,S.t*K)}<input id="slfb" type="range" min="0" max="100" value="${S.fb}" oninput="S.fb=+this.value;bfu()"><button onclick="play('fb')">▶ Putar animasi</button></div>`,
lkpd:()=>{const u=S.me;const okLv=l=>l<=u.lv;return [...S.lk].sort((a,b)=>a.lv-b.lv).map(x=>{const s=u.sub[x.id];if(!okLv(x.lv))return `<div class="card lock"><h3>🔒 ${e(x.t)} <span class="tag">Level ${x.lv}</span></h3><p class="mu">Terbuka saat kamu mencapai level ${x.lv}.</p></div>`;return `<div class="card"><h3>${e(x.t)} <span class="tag">Level ${x.lv}</span></h3><div class="ban"><b>Petunjuk:</b> ${e(x.ins)}</div>${x.acts.map((a,i)=>`<p><b>Kegiatan ${i+1}.</b> ${e(a)}</p>${s?`<div class="ban">${e(s.a[i]||'-')}</div>`:`<textarea id="la${x.id}_${i}" rows="2"></textarea>`}`).join('')}${s?`<span class="tag">Terkumpul</span>${s.fb?`<div class="ban">💬 Feedback guru: ${e(s.fb)}</div>`:'<p class="mu">Menunggu feedback guru.</p>'}`:`<button onclick="subm(${x.id})">Kumpulkan LKPD</button>`}</div>`}).join('')},
tantangan:()=>{const u=S.me,l=S.tc.filter(c=>c.lv<=u.lv);return `<p class="mu">Pilih kartu dan selesaikan tantangannya. Kartu baru terbuka seiring naiknya level.</p><div class="grid">${l.map((c,i)=>`<div class="card"><span class="tag">Level ${c.lv}</span> ${u.tch[c.id]?'<span class="tag">✔ Selesai</span>':''}<br>${S.tco[c.id]?`<b>${e(c.q)}</b>${c.h?`<p class="mu">💡 ${e(c.h)}</p>`:''}<input id="tc${c.id}" type="number" placeholder="Jawaban"><button onclick="tchk(${c.id})">Periksa</button><div id="tr${c.id}">${u.tch[c.id]?'<div class="ban">🎉 Tantangan selesai!</div>':''}</div>`:`<button onclick="S.tco[${c.id}]=1;draw(1)">🎴 Buka kartu ${i+1}</button>`}</div>`).join('')||'<p class="mu">Belum ada tantangan untuk levelmu.</p>'}</div>`},
latihan:()=>{const u=S.me,L=[1,2,3,4,5,6],un=n=>n<=u.lv;promote(u);if(!un(S.lv))S.lv=1;return `<div class="side">${L.map(n=>`<button class="${S.lv==n?'on':''} ${un(n)?'':'lock'}" ${un(n)?'':'disabled'} onclick="S.lv=${n};draw(1)">${done(u,'L'+n)?'✔ ':un(n)?'':'🔒 '}Level ${n}</button>`).join('')}</div>${qs('L'+S.lv)}`},
game:gameT,kuis:()=>qs('kuis'),eval:()=>qs('eval')+evuH(),
tutor:()=>`<div class="card"><h3>🤖 Tanya Tutor AI</h3><p class="mu" style="font-size:13px">Demo: jawaban simulasi berbasis kata kunci.</p><div style="max-height:260px;overflow:auto">${S.chat.map(c=>`<p style="text-align:${c.b?'left':'right'}"><span class="tag" style="${c.b?'':'background:var(--pr);color:var(--onpr)'}">${e(c.t)}</span></p>`).join('')}</div><input id="q" placeholder="Tulis pertanyaan…" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Kirim</button></div>`,
progres:()=>{const u=S.me;return `<div class="card"><h3>Progres keseluruhan: ${prog(u)}%</h3><div class="bar"><div style="width:${prog(u)}%"></div></div></div><div class="card"><table class="tbl">${TABS.map(t=>`<tr><td>${t[1]}</td><td>${ok(u,t[0])?(u.vis.includes(t[0])?'✔ Dibuka':'Belum'):'🔒'}</td></tr>`).join('')}</table><p>Kuis: <b>${sc(u,'kuis')}</b> • Evaluasi: <b>${sc(u,'eval')}</b> • Poin game: <b>${G(u).pts}</b> • Level latihan selesai: <b>${[1,2,3,4,5,6].filter(n=>done(u,'L'+n)).length}/6</b></p></div>`}};

function gameHub(){const u=S.me,w=W(u),c=compl(u),ok2=gateOk(u),req=Object.keys(S.greq).filter(x=>S.greq[x]);return `<div class="card"><h3>🔑 Syarat membuka game</h3><p class="mu">Selesaikan <b>salah satu</b>: ${req.map(x=>`<span class="tag">${c[x]?'✔':'○'} ${GL[x]}</span>`).join(' ')}</p>${ok2?'<p>✅ Syarat terpenuhi. Tukarkan koinmu untuk masuk ke game.</p>':`<div class="side">${req.map(x=>`<button class="g" onclick="S.tab='${x}';draw()">Ke ${GL[x]}</button>`).join('')}</div>`}<p><span class="coin">🪙 ${w.coin} koin</span> <span class="tag">Kesulitan: ${S.dset[tier(u)].map(d=>DIF[d]).join(' + ')}</span></p></div><div class="grid">${S.games.filter(x=>stt(x)!='draft').map(x=>{const lock=stt(x)=='lock',low=w.coin<x.cost;return `<div class="tile ${ok2&&!lock&&!low?'':'lk'}" style="background:linear-gradient(135deg,${(GC[x.k]||['#004aad,#e385ec','#fff'])[0]});color:${(GC[x.k]||['','#fff'])[1]}"><div class="em">${x.ic}</div><h3 style="margin:6px 0">${e(x.n)}</h3><p style="margin:0 0 10px;font-size:14px;opacity:.95">${e(x.d)}</p><span class="coin">🪙 ${x.cost}</span><p style="margin:12px 0 0">${lock?'🔒 Dikunci oleh guru.':!ok2?'🔒 Selesaikan salah satu syarat dulu.':low?`Koin belum cukup (butuh ${x.cost}). Kumpulkan dari kegiatan belajar.`:`<button style="background:#fff;color:#12113e;box-shadow:none" onclick="enterGame('${x.k}')">▶ Main (−${x.cost} 🪙)</button>`}</p></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>🏅 Lencana</h3>${BDG.map(b=>`<span class="bdg ${b[2](u)?'':'off'}" title="${e(b[3])}">${b[0]} ${b[1]}</span>`).join('')}</div><div class="card"><h3>🏆 Papan peringkat</h3>${rankTbl(5)}</div>`}
function gameT(){const u=S.me,x=S.games.find(g=>g.k==S.gm),hud=`<div class="hud"><span class="coin" style="font-size:16px">🪙 ${W(u).coin}</span><span class="pts">⭐ ${G(u).pts} poin</span><span class="tag">${S.dset[tier(u)].map(d=>DIF[d]).join('+')}</span><button class="g" onclick="S.snd=!S.snd;draw(1)">${S.snd?'🔊':'🔇'}</button></div>`;if(!x||stt(x)!='open'||!gateOk(u)){S.gm=null;return `<div class="arena">${hud}<h2>🎮 Arena Game</h2>${gameHub()}</div>`}return `<div class="arena">${hud}<button class="g" onclick="S.gm=null;S.gmsg='';draw()" style="margin-bottom:12px">← Menu game</button>${({kota:gKota,er:gEr,mm:gMm,gp:gGp})[x.k]()}</div>`}

const BT={b:{n:'Bata',ic:'🧱',c:['#ffa14d','#e0701a','#b85509']},g:{n:'Kaca',ic:'🪟',c:['#cdeeff','#7cc3f2','#4f9fd6']},r:{n:'Atap',ic:'🟪',c:['#c68cf5','#8a4fd1','#6a38a8']},d:{n:'Pintu',ic:'🚪',c:['#9a5f36','#6e4020','#52300f']}};
function tgtOf(m){const o={};for(let z=0;z<m.t;z++)for(let y=0;y<m.l;y++)for(let x=0;x<m.p;x++){let k='b';if(m.types){if(z==m.t-1&&m.t>=2)k='r';else if(z==0&&y==m.l-1&&x==Math.floor(m.p/2))k='d';else if(z>=1&&z<m.t-1&&y==m.l-1&&x%2==0)k='g'}o[x+','+y+','+z]=k}return o}
const cntT=o=>Object.values(o).reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{});
function isoSVG(cells,p,l,t){const E=Object.keys(cells).map(k=>k.split(',').map(Number).concat(cells[k])).sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);let s='';E.forEach(([x,y,z,k])=>{const X=(x-y)*17,Y=(x+y)*10-z*20,c=BT[k].c,st='stroke="rgba(0,0,0,.35)" stroke-width=".6"';s+=`<polygon points="${X},${Y} ${X+17},${Y+10} ${X},${Y+20} ${X-17},${Y+10}" fill="${c[0]}" ${st}/><polygon points="${X-17},${Y+10} ${X},${Y+20} ${X},${Y+40} ${X-17},${Y+30}" fill="${c[1]}" ${st}/><polygon points="${X},${Y+20} ${X+17},${Y+10} ${X+17},${Y+30} ${X},${Y+40}" fill="${c[2]}" ${st}/>`});const vw=(p+l)*17+40;return `<svg viewBox="${-l*17-20} ${-(t-1)*20-6} ${vw} ${(p+l-2)*10+(t-1)*20+54}" style="width:100%;max-width:${Math.round(vw*1.7)}px;height:auto;display:block;margin:auto" role="img" aria-label="Gedung">${s}</svg>`}
function bgNew(m){S.bg={id:m.id,step:1,sel:'b',z:0,cells:{},peek:0};S.bv='';S.gmsg=''}
function bgUse(B,k){return Object.values(B.cells).filter(v=>v==k).length}
function bgOpen(id){const m=S.gk.find(x=>x.id==id),v=+S.bv;S.gok=false;if(S.bv==='')S.gmsg='Isi dulu jumlah balok bahan yang dibutuhkan.';else if(v!=m.p*m.l*m.t)S.gmsg=v==m.p*m.l?'Itu baru satu lantai. Kalikan juga dengan tinggi (jumlah lantai).':'Belum tepat. Banyak balok = panjang × lebar × tinggi.';else{S.bg.step=2;S.gok=true;S.gmsg=`📦 Peti bahan terbuka! ${m.p}×${m.l}×${m.t} = ${v} balok. Susun lantai demi lantai.`}draw(1)}
function bgCell(x,y){const B=S.bg,m=S.gk.find(q=>q.id==B.id),tg=tgtOf(m),need=cntT(tg),k=x+','+y+','+B.z;S.gmsg='';if(B.cells[k]==B.sel)delete B.cells[k];else{if(bgUse(B,B.sel)-(B.cells[k]==B.sel?1:0)>=need[B.sel]){S.gmsg=`Stok ${BT[B.sel].n} habis. Pilih bahan lain atau lepas balok yang sudah dipasang.`;return draw(1)}B.cells[k]=B.sel}draw(1)}
function bgChk(id){const m=S.gk.find(x=>x.id==id),B=S.bg,tg=tgtOf(m),g=G(S.me),n=Object.keys(B.cells).length,tot=m.p*m.l*m.t;S.gok=false;if(n<tot)S.gmsg=`Masih kurang ${tot-n} balok. Cek tiap lantai (Lantai 1 sampai ${m.t}).`;else{const bad=Object.keys(tg).filter(k=>B.cells[k]!=tg[k]);if(bad.length){const z=+bad[0].split(',')[2]+1;S.gmsg=`Ada ${bad.length} balok yang jenisnya belum cocok dengan gambar, mulai dari Lantai ${z}. Gunakan tombol "Lihat target".`}else{S.gok=true;if(!g.done['k'+id]){g.done['k'+id]=1;const p=15+5*(m.dif||1);g.pts+=p;S.gmsg=`🏗️ Gedung selesai! ${tot} balok tersusun. +${p} poin`}else S.gmsg='✅ Gedung benar! (poin misi ini sudah kamu dapat)'}}draw(1)}
function gKota(){const u=S.me,g=G(u),ms=S.gk.filter(m=>difOk(u,m.dif)&&shOk(m));if(!ms.length)return '<div class="card">Belum ada misi untuk tingkat kesulitanmu.</div>';if(!ms.find(m=>m.id==S.bk))S.bk=ms[0].id;const m=ms.find(x=>x.id==S.bk);if(!S.bg||S.bg.id!=m.id)bgNew(m);const B=S.bg,tg=tgtOf(m),need=cntT(tg),vol=m.p*m.l*m.t;
let h=`<div class="card"><h3>🏗️ Bangun Gedung</h3><p class="mu">Lihat gambar gedung impian, hitung bahan yang dibutuhkan, lalu susun balok lantai demi lantai seperti di Minecraft.</p><div class="side">${ms.map((x,i)=>`<button class="${x.id==S.bk?'on':''}" onclick="S.bk=${x.id};draw(1)">${g.done['k'+x.id]?'✔ ':''}Misi ${i+1} ${DIF[x.dif||1][0]}</button>`).join('')}</div><div class="ban"><b>Gedung impian:</b> panjang ${m.p}, lebar ${m.l}, tinggi ${m.t} ${m.types?'(ada pintu, jendela kaca, dan atap)':''} ${g.done['k'+m.id]?'— selesai ✔':''}</div>${isoSVG(tg,m.p,m.l,m.t)}</div>`;
if(B.step==1)h+=`<div class="card"><h3>📦 Langkah 1: Hitung bahan</h3><p>Berapa balok bahan yang dibutuhkan untuk membangun gedung ${m.p} × ${m.l} × ${m.t}?</p><input type="number" placeholder="Jumlah balok" value="${e(S.bv)}" oninput="S.bv=this.value" onkeydown="if(event.key=='Enter')bgOpen(${m.id})"><button onclick="bgOpen(${m.id})">Buka peti bahan</button></div>`;
else{const ty=Object.keys(need),rem=k=>need[k]-bgUse(B,k);h+=`<div class="card"><h3>🧰 Langkah 2: Susun bangunan</h3><div class="side">${ty.map(k=>`<button class="${B.sel==k?'on':''}" onclick="S.bg.sel='${k}';draw(1)">${BT[k].ic} ${BT[k].n} (${rem(k)}/${need[k]})</button>`).join('')}</div><div class="side">${Array.from({length:m.t},(_,z)=>`<button class="${B.z==z?'on':''}" onclick="S.bg.z=${z};draw(1)">Lantai ${z+1}</button>`).join('')}<button class="g" onclick="S.bg.peek=${B.peek?0:1};draw(1)">${B.peek?'Sembunyikan':'👁 Lihat'} target</button></div><p class="mu" style="font-size:13px">Baris atas = sisi belakang, baris bawah = sisi depan (tempat pintu & jendela). Ketuk kotak untuk memasang atau melepas balok.</p><div class="vxg" style="grid-template-columns:repeat(${m.p},48px)">${Array.from({length:m.l},(_,y)=>Array.from({length:m.p},(_,x)=>{const k=x+','+y+','+B.z,v=B.cells[k],t=tg[k];return `<button class="vx" style="${v?`background:${BT[v].c[0]};border-color:${BT[v].c[2]}`:''}" onclick="bgCell(${x},${y})">${v?BT[v].ic:B.peek?`<span style="opacity:.45">${BT[t].ic}</span>`:''}</button>`}).join('')).join('')}</div><button class="g" onclick="Object.keys(S.bg.cells).filter(k=>k.split(',')[2]==S.bg.z).forEach(k=>delete S.bg.cells[k]);draw(1)">Kosongkan lantai ini</button> <button onclick="bgChk(${m.id})">✔ Periksa bangunan</button></div><div class="card"><h3>Bangunanmu</h3>${Object.keys(B.cells).length?isoSVG(B.cells,m.p,m.l,m.t):'<p class="mu">Belum ada balok terpasang.</p>'}<p class="mu">${Object.keys(B.cells).length}/${vol} balok terpasang</p></div>`}

function mzGen(n){const N=2*n+1,g=Array.from({length:N*N},()=>1),seen=new Set([0]),st=[0],D=[[-1,0],[0,1],[1,0],[0,-1]],cell=i=>(2*Math.floor(i/n)+1)*N+2*(i%n)+1;g[cell(0)]=0;while(st.length){const i=st[st.length-1],r=Math.floor(i/n),c=i%n,nb=D.filter(d=>{const a=r+d[0],b=c+d[1];return a>=0&&a<n&&b>=0&&b<n&&!seen.has(a*n+b)});if(!nb.length){st.pop();continue}const d=nb[Math.floor(Math.random()*nb.length)],j=(r+d[0])*n+c+d[1];g[cell(j)]=0;g[(2*r+1+d[0])*N+2*c+1+d[1]]=0;seen.add(j);st.push(j)}return g}

A.acak=()=>{const q=S.qr,ss=[['L1','Latihan Level 1'],['L2','Latihan Level 2'],['L3','Latihan Level 3'],['L4','Latihan Level 4'],['L5','Latihan Level 5'],['L6','Latihan Level 6'],['kuis','Kuis'],['eval','Evaluasi']];return `<div class="card"><h3>🔀 Acak soal per akun</h3><p class="mu">Berlaku untuk semua latihan, kuis, dan evaluasi. Setiap siswa mendapat acakan yang berbeda dari siswa lain.</p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${q.ord!==0?'checked':''} onchange="qrSet('ord',this.checked?1:0)"> Acak urutan soal</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${q.opt!==0?'checked':''} onchange="qrSet('opt',this.checked?1:0)"> Acak urutan pilihan jawaban</label><label>Ganti acakan</label><select onchange="qrSet('ep',this.value)">${[['tetap','Tetap (satu acakan per akun)'],['hari','Setiap hari'],['minggu','Setiap minggu']].map(x=>`<option value="${x[0]}" ${q.ep==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="card"><h3>Jumlah soal per siswa</h3><p class="mu">Isi 0 untuk memberi semua soal. Jika diisi (mis. 5), tiap siswa mendapat 5 soal berbeda yang diambil acak dari bank soal. Soal yang sudah dijawab siswa tidak hilang.</p><table class="tbl"><tr><th>Kegiatan</th><th>Bank soal</th><th>Soal per siswa</th></tr>${ss.map(x=>`<tr><td>${x[1]}</td><td>${Q[x[0]].length}</td><td><input id="qp_${x[0]}" type="number" min="0" max="${Q[x[0]].length}" style="width:90px;margin:0" value="${q.pick[x[0]]||0}"></td></tr>`).join('')}</table><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px"><button onclick="qrSave()">💾 Simpan pengaturan acak</button><span id="qrmsg" style="font-weight:600"></span></div></div>`};
function addAdminTab(key,label){const o=V.admin;V.admin=()=>o().replace(/(<button[^>]*onclick="S\.at='pro';draw\(\)">Progres<\/button>)/,`$1<button class="${S.at==key?'on':''}" onclick="S.at='${key}';draw()">${label}</button>`)}
addAdminTab('acak','Acak Soal');addAdminTab('shopee','Pembayaran Shopee');
if(SBON)setTimeout(shpLoad,0);
/* ===== v21: bangun ruang "Soon" + LKPD edit/hapus ===== */
const SOONL=[['tabung','Tabung'],['kerucut','Kerucut'],['bola','Bola'],['limas','Limas'],['prisma','Prisma']];let SOONN=0;
function soonIc(k,sz){const i=++SOONN,L=`<linearGradient id="sl${i}" x1="0" x2="1"><stop offset="0" stop-color="#9cc4ff"/><stop offset=".55" stop-color="#1f7aff"/><stop offset="1" stop-color="#004aad"/></linearGradient>`,R=`<radialGradient id="sr${i}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d6e6ff"/><stop offset=".5" stop-color="#1f7aff"/><stop offset="1" stop-color="#12113e"/></radialGradient>`,S0='stroke="#004aad" stroke-width="1.4" stroke-linejoin="round"';
const g={tabung:`<defs>${L}</defs><path d="M18 22v38c0 5 9 9 22 9s22-4 22-9V22z" fill="url(#sl${i})"/><ellipse cx="40" cy="22" rx="22" ry="9" fill="#b9d5ff" ${S0}/>`,
kerucut:`<defs>${L}</defs><path d="M40 8 62 58c0 6-10 10-22 10S18 64 18 58z" fill="url(#sl${i})"/><path d="M18 58c0 6 10 10 22 10s22-4 22-10" fill="none" ${S0}/>`,
bola:`<defs>${R}</defs><circle cx="40" cy="40" r="28" fill="url(#sr${i})"/><ellipse cx="40" cy="40" rx="28" ry="8" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" stroke-dasharray="3 3"/>`,
limas:`<polygon points="40,8 14,56 40,70" fill="#4d8dff" ${S0}/><polygon points="40,8 40,70 66,56" fill="#004aad" ${S0}/><polygon points="40,8 14,56 40,44 66,56" fill="#9cc4ff" fill-opacity=".35" ${S0}/>`,
prisma:`<polygon points="10,62 34,20 58,62" fill="#9cc4ff" ${S0}/><polygon points="34,20 48,10 72,52 58,62" fill="#1f7aff" ${S0}/><polygon points="10,62 58,62 72,52 24,52" fill="#004aad" ${S0}/>`}[k];
return `<svg viewBox="0 0 80 80" width="${sz}" height="${sz}" aria-hidden="true">${g}</svg>`}
const soonCards=()=>`<div class="soonw">${SOONL.map(s=>`<div class="sn"><span class="snb">SOON</span>${soonIc(s[0],72)}<b>${s[1]}</b></div>`).join('')}</div>`;
const soonChips=()=>SOONL.map(s=>`<button class="soonb" disabled title="Segera hadir">${soonIc(s[0],20)} ${s[1]} <i>SOON</i></button>`).join('');
{const o=V.home;V.home=()=>o().replace('<h2>Paket Langganan</h2>',`<h2>Segera Hadir 🚀</h2><div class="card"><p class="mu" style="margin-top:0">Bangun ruang lainnya sedang kami siapkan, lengkap dengan visualisasi 3D dan kegiatan belajarnya.</p>${soonCards()}</div><h2>Paket Langganan</h2>`)}
/* LKPD: edit & hapus */
S.lke=null;
function lkEdit(id){S.lke=id;draw();setTimeout(()=>{const f=document.getElementById('lkform');if(f)f.scrollIntoView({behavior:'smooth',block:'start'})},50)}
function lkCancel(){S.lke=null;draw()}
function lkDel(id){const x=S.lk.find(z=>z.id==id);if(!x||!confirm('Hapus "'+x.t+'"?\nJawaban siswa untuk LKPD ini juga ikut terhapus.'))return;S.lk=S.lk.filter(z=>z.id!=id);S.users.forEach(u=>{if(u.sub)delete u.sub[id]});if(S.lke==id)S.lke=null;draw()}
function lkAddAct(id){const el=$('ka'+id),v=el&&el.value.trim();if(!v)return;S.lk.find(z=>z.id==id).acts.push(v);draw()}
function lkDelAct(id,i){const x=S.lk.find(z=>z.id==id);if(!x)return;if(x.acts.length<=1)return alert('LKPD harus punya minimal satu kegiatan. Untuk menghapus seluruh LKPD, pakai tombol Hapus.');if(!confirm('Hapus kegiatan ini? Jawaban siswa untuk kegiatan ini ikut terhapus.'))return;x.acts.splice(i,1);S.users.forEach(u=>{const s=u.sub&&u.sub[id];if(s&&s.a)s.a.splice(i,1)});draw()}
function lkSave(){const t=$('lt').value.trim(),a=$('lc').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!t||!a.length)return alert('Isi judul dan minimal satu kegiatan');const d={t,lv:+$('ll').value,dif:+$('ld').value,sh:$('ls2').value,ins:$('li').value.trim()||'Kerjakan dengan teliti.',acts:a};if(S.lke){const x=S.lk.find(z=>z.id==S.lke);if(x)Object.assign(x,d);S.lke=null}else S.lk.push(Object.assign({id:Date.now()},d));draw()}
function lkFb(uid,id){const u=S.users.find(x=>x.id==uid);if(u&&u.sub&&u.sub[id]){u.sub[id].fb=$('fb'+uid+'_'+id).value;draw()}}
A.lkpd=()=>{const ed=S.lke?S.lk.find(z=>z.id==S.lke):null,pick=(h,v)=>h.replace('value="'+v+'"','value="'+v+'" selected');
return `<div class="card"><h3>LKPD</h3>${[...S.lk].sort((a,b)=>a.lv-b.lv).map(x=>`<div class="ban" ${S.lke==x.id?'style="outline:2px solid #004aad"':''}><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${e(x.t)}</b> ${shTag(x)} <span class="tag">Level ${x.lv}</span> ${dtag(x.dif)}<span style="margin-left:auto;display:flex;gap:6px"><button class="s g" onclick="lkEdit(${x.id})">✏️ Edit</button><button class="s d" onclick="lkDel(${x.id})">🗑 Hapus</button></span></div><ol>${x.acts.map((a,i)=>`<li>${e(a)} <button class="s d" title="Hapus kegiatan ini" onclick="lkDelAct(${x.id},${i})">✕</button></li>`).join('')}</ol><input id="ka${x.id}" placeholder="Tambah kegiatan baru"><button class="s" onclick="lkAddAct(${x.id})">+ Kegiatan</button></div>`).join('')||'<p class="mu">Belum ada LKPD.</p>'}</div>
<div class="card" id="lkform"><h3>${ed?'✏️ Edit LKPD':'LKPD baru'}</h3><input id="lt" placeholder="Judul LKPD" value="${ed?e(ed.t):''}"><div class="grid"><div><label>Bangun ruang</label><select id="ls2">${pick(shOpt(),ed?ed.sh||'both':'both')}</select></div><div><label>Kesulitan</label><select id="ld">${pick(dOpt(),ed?ed.dif||1:1)}</select></div><div><label>Level</label><select id="ll">${[1,2,3,4,5,6].map(n=>`<option ${ed&&ed.lv==n?'selected':''}>${n}</option>`).join('')}</select></div></div><textarea id="li" rows="2" placeholder="Petunjuk pengerjaan">${ed?e(ed.ins||''):''}</textarea><textarea id="lc" rows="4" placeholder="Kegiatan (satu per baris)">${ed?e(ed.acts.join('\n')):''}</textarea>${ed?'<p class="mu" style="font-size:13px">Mengubah isi kegiatan tidak menghapus jawaban siswa yang sudah ada.</p>':''}<button onclick="lkSave()">${ed?'Simpan perubahan':'Tambah LKPD'}</button>${ed?' <button class="g" onclick="lkCancel()">Batal</button>':''}</div>
<div class="card"><h3>Pengumpulan siswa &amp; feedback</h3>${S.users.flatMap(u=>Object.entries(u.sub||{}).map(([id,s])=>{const x=S.lk.find(z=>z.id==id);return x?`<div class="ban"><b>${e(u.nama)}</b> — ${e(x.t)}${(s.a||[]).map((a,i)=>`<div>${i+1}. ${e(a)}</div>`).join('')}<input id="fb${u.id}_${id}" placeholder="Feedback" value="${e(s.fb||'')}"><button class="s" onclick="lkFb(${u.id},${id})">Kirim feedback</button></div>`:''})).join('')||'<p class="mu">Belum ada pengumpulan.</p>'}</div>`};
draw();
</script></body></html>
